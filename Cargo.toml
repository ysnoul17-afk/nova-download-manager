[workspace]
resolver = "2"
members = ["crates/ndm-engine", "apps/desktop/src-tauri", "crates/ndm-ipc", "crates/ndm-native-host"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
authors = ["Yassine Oulghazi"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
