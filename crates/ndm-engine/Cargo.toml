[package]
name = "ndm-engine"
version = "0.4.2"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "system-proxy"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
parking_lot = "0.13.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
